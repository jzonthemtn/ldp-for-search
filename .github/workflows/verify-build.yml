name: Verify generated files

# The repo commits build outputs next to the sources that produce them, so a
# change to build_slides.py or build_diagrams.py can leave the committed deck
# stale. This rebuilds and fails if anything tracked would have changed.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - run: pip install -r requirements-build.txt

      # The pptx is a zip, so its bytes change on every build even when nothing
      # inside does. Keep the committed contents to compare against instead.
      - name: Unpack the committed deck
        run: unzip -q ldp_for_search_slides.pptx -d /tmp/committed-pptx

      - name: Rebuild
        run: |
          python build_diagrams.py | tee /tmp/diagrams.txt
          python build_slides.py

      # Only the diagrams build_diagrams.py actually writes. The measured plots
      # come from the notebook, which needs the WANDS download and an embedding
      # model, so they are out of scope here.
      # git status rather than git diff, so a generated file that was never
      # committed fails loudly instead of passing as "no change".
      - name: Diagrams must match
        run: |
          files=$(sed -n 's/^wrote //p' /tmp/diagrams.txt)
          echo "checking: $files"
          changed=$(git status --porcelain -- $files)
          if [ -n "$changed" ]; then
            echo "these differ from what is committed:"
            echo "$changed"
            exit 1
          fi

      - name: Deck contents must match
        run: |
          unzip -q ldp_for_search_slides.pptx -d /tmp/rebuilt-pptx
          diff -r /tmp/committed-pptx /tmp/rebuilt-pptx

      - name: Explain a failure
        if: failure()
        run: |
          echo "::error::Committed build outputs are stale. Run:"
          echo "::error::  python build_diagrams.py && python build_slides.py"
          echo "::error::  soffice --headless --convert-to pdf ldp_for_search_slides.pptx"
          echo "::error::then commit the results."
